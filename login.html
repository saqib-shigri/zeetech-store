<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up - Zeetech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #080c14;
      --accent-cyan: #00d4ff;
      --text-primary: #fff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: rgba(255,255,255,0.06);
      --border-medium: rgba(255,255,255,0.1);
      --danger: #ef4444;
      --success: #22c55e;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow-x: hidden; }
    .bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(0,100,200,0.05) 0%, transparent 50%); z-index: 0; }
    .glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,0.05) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 450px; margin: 40px 20px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand a { text-decoration: none; }
    .brand h1 { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand p { color: var(--text-secondary); font-size: 15px; }
    .card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 40px 36px; backdrop-filter: blur(20px); }
    .mode-toggle { display: flex; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px; }
    .mode-btn { flex: 1; background: none; border: none; padding: 12px; font-size: 16px; font-weight: 600; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-md); transition: all 0.3s; }
    .mode-btn.active { background: rgba(0,212,255,0.1); color: var(--accent-cyan); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .input-wrap input { width: 100%; padding: 14px 44px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-primary); font-size: 14px; outline: none; }
    .input-wrap input:focus { border-color: var(--accent-cyan); }
    .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
    .checkbox { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer; }
    .checkbox input { accent-color: var(--accent-cyan); cursor: pointer; }
    .forgot-link { color: var(--accent-cyan); text-decoration: none; cursor: pointer; }
    .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #000; border: none; border-radius: var(--radius-full); font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 24px; }
    .divider { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; color: var(--text-muted); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
    .btn-google { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border-subtle); border-radius: var(--radius-full); color: var(--text-primary); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    .btn-google:hover { background: rgba(255,255,255,0.03); }
    .switch-text { text-align: center; margin-top: 28px; font-size: 14px; color: var(--text-secondary); }
    .switch-text a { color: var(--accent-cyan); text-decoration: none; cursor: pointer; }
    .password-strength { margin-top: 8px; font-size: 11px; }
    .strength-bar { height: 3px; background: var(--border-subtle); border-radius: 3px; margin-top: 6px; }
    .strength-fill { height: 100%; border-radius: 3px; width: 0%; transition: all 0.3s; }
    @media (max-width: 480px) { .card { padding: 32px 24px; } .brand h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <div class="bg"></div><div class="glow"></div>
  <div class="container">
    <div class="brand"><a href="index.html"><h1>Zeetech</h1></a><p>Precision engineering for the next generation.</p></div>
    <div class="card">
      <div class="mode-toggle"><button class="mode-btn active" id="loginModeBtn" onclick="switchMode('login')">Sign In</button><button class="mode-btn" id="signupModeBtn" onclick="switchMode('signup')">Create Account</button></div>
      <div id="loginForm"><form onsubmit="handleLogin(event)"><div class="form-group"><label>Email</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input type="email" id="loginEmail" placeholder="name@company.com" required></div></div><div class="form-group"><label>Password</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="loginPassword" placeholder="••••••••" required><button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">👁</button></div></div><div class="form-row"><label class="checkbox"><input type="checkbox" id="rememberMe"> Remember me</label><a href="#" class="forgot-link" onclick="showToast('Reset link sent to your email!'); return false;">Forgot?</a></div><button type="submit" class="btn-submit">SIGN IN</button></form></div>
      <div id="signupForm" style="display:none;"><form onsubmit="handleSignup(event)"><div class="form-group"><label>Full Name</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><input type="text" id="signupName" placeholder="John Doe" required></div></div><div class="form-group"><label>Email</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input type="email" id="signupEmail" placeholder="name@company.com" required></div></div><div class="form-group"><label>Password</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="signupPassword" placeholder="Create password" required onkeyup="checkStrength()"><button type="button" class="toggle-password" onclick="togglePassword('signupPassword')">👁</button></div><div class="password-strength"><div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div><span id="strengthText" style="color:var(--text-muted);"></span></div></div><div class="form-group"><label>Confirm Password</label><div class="input-wrap"><span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="confirmPassword" placeholder="Confirm password" required><button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button></div></div><div class="form-row"><label class="checkbox"><input type="checkbox" id="agreeTerms" required> I agree to Terms</label></div><button type="submit" class="btn-submit">CREATE ACCOUNT</button></form></div>
      <div class="divider">Or</div>
      <button class="btn-google" onclick="showToast('Google Sign In coming soon!')"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Google</button>
      <div class="switch-text" id="switchText">Don't have an account? <a onclick="switchMode('signup')">Create one</a></div>
    </div>
  </div>
  <script>
    function switchMode(mode) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const loginBtn = document.getElementById('loginModeBtn');
      const signupBtn = document.getElementById('signupModeBtn');
      const switchText = document.getElementById('switchText');
      if (mode === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        loginBtn.classList.add('active');
        signupBtn.classList.remove('active');
        switchText.innerHTML = `Don't have an account? <a onclick="switchMode('signup')">Create one</a>`;
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        loginBtn.classList.remove('active');
        signupBtn.classList.add('active');
        switchText.innerHTML = `Already have an account? <a onclick="switchMode('login')">Sign in</a>`;
      }
    }
    
    function togglePassword(id) { 
      const input = document.getElementById(id); 
      input.type = input.type === 'password' ? 'text' : 'password'; 
    }
    
    function checkStrength() {
      const pwd = document.getElementById('signupPassword').value;
      const fill = document.getElementById('strengthFill');
      const text = document.getElementById('strengthText');
      let strength = 0, color = '#ef4444', msg = 'Weak';
      if (pwd.length >= 6) strength++;
      if (pwd.length >= 10) strength++;
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength++;
      if (/[0-9]/.test(pwd)) strength++;
      if (/[^a-zA-Z0-9]/.test(pwd)) strength++;
      if (strength <= 2) { color = '#ef4444'; msg = 'Weak'; }
      else if (strength <= 4) { color = '#f59e0b'; msg = 'Medium'; }
      else { color = '#22c55e'; msg = 'Strong'; }
      if (pwd.length === 0) { fill.style.width = '0%'; text.textContent = ''; }
      else { fill.style.width = (strength / 6) * 100 + '%'; fill.style.backgroundColor = color; text.textContent = msg; text.style.color = color; }
    }
    
    function showToast(msg, type = 'success') {
      const toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = `position:fixed; bottom:24px; right:24px; background:${type === 'error' ? '#ef4444' : 'linear-gradient(135deg,#00d4ff,#0099cc)'}; color:${type === 'error' ? '#fff' : '#000'}; padding:14px 24px; border-radius:12px; font-weight:600; z-index:10000; animation:slideIn 0.3s ease;`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 2500);
    }
    
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!email.includes('@')) { showToast('Invalid email', 'error'); return; }
      if (pwd.length < 4) { showToast('Password too short', 'error'); return; }
      
      // Get users from localStorage
      const users = JSON.parse(localStorage.getItem('zeetech_users') || '[]');
      const user = users.find(u => u.email === email && u.password === pwd);
      
      if (!user) {
        showToast('Invalid email or password!', 'error');
        return;
      }
      
      // Save logged in user info
      localStorage.setItem('zeetech_logged_in', JSON.stringify({
        name: user.name,
        email: user.email,
        isLoggedIn: true
      }));
      
      if (rememberMe) {
        localStorage.setItem('rememberedEmail', email);
      } else {
        localStorage.removeItem('rememberedEmail');
      }
      
      showToast(`Welcome back ${user.name}! Redirecting...`);
      setTimeout(() => window.location.href = 'index.html', 1500);
    }
    
    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const pwd = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const agree = document.getElementById('agreeTerms').checked;
      
      if (!email.includes('@')) { showToast('Invalid email', 'error'); return; }
      if (pwd.length < 6) { showToast('Password must be 6+ chars', 'error'); return; }
      if (pwd !== confirm) { showToast('Passwords do not match', 'error'); return; }
      if (!agree) { showToast('Accept terms', 'error'); return; }
      
      // Save user to localStorage
      const users = JSON.parse(localStorage.getItem('zeetech_users') || '[]');
      if (users.find(u => u.email === email)) {
        showToast('Email already registered!', 'error');
        return;
      }
      users.push({ name, email, password: pwd });
      localStorage.setItem('zeetech_users', JSON.stringify(users));
      
      // Auto login after signup
      localStorage.setItem('zeetech_logged_in', JSON.stringify({
        name: name,
        email: email,
        isLoggedIn: true
      }));
      
      showToast(`Welcome ${name}! Account created.`);
      setTimeout(() => window.location.href = 'index.html', 1500);
    }
    
    const style = document.createElement('style');
    style.textContent = '@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}';
    document.head.appendChild(style);
    
    // Load remembered email
    if (localStorage.getItem('rememberedEmail')) {
      document.getElementById('loginEmail').value = localStorage.getItem('rememberedEmail');
      document.getElementById('rememberMe').checked = true;
    }
  </script>
</body>
</html>
